<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtKante — Admin Panel</title>
    <link rel="stylesheet" href="/styles/css/main.css">
</head>
<body class="admin-body">
    <div class="admin" data-js-admin>
        <aside class="admin__sidebar" data-js-admin-sidebar>
            <a href="./Home.html" class="admin__logo"><img src="/images/logo.svg" alt="ArtKante"></a>
            <nav class="admin__nav">
                <button class="admin__nav-btn is-active" data-js-admin-tab="dashboard">Дашборд</button>
                <button class="admin__nav-btn" data-js-admin-tab="concepts">Концепты</button>
                <button class="admin__nav-btn" data-js-admin-tab="users">Пользователи</button>
            </nav>
            <button class="admin__logout" data-js-admin-logout>Выйти</button>
        </aside>

        <main class="admin__main" data-js-admin-main>
            <header class="admin__header">
                <h1 class="admin__title" data-js-admin-title>Дашборд</h1>
                <button class="header__theme-toggle" data-js-theme-toggle aria-label="Тёмная тема">
                <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </header>
        <div class="admin__content" data-js-admin-content>
            <!-- Контент подгружается JS -->
        </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="/scripts/main.js"></script>
</body>
</html>
